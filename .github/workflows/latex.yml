name: Build LaTeX CV

on:
  push:
    branches:
      - main

jobs:
  build-latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: CV
          path: cv.pdf
